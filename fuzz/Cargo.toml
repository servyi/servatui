[package]
name = "servatui-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
servyi-servatui = { path = ".." }
arbitrary = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossterm = "0.28"
ratatui = "0.28"

[lib]
path = "src/lib.rs"

[[bin]]
name = "protocol_server"
path = "fuzz_targets/protocol_server.rs"
test = false
doc = false

[[bin]]
name = "protocol_client"
path = "fuzz_targets/protocol_client.rs"
test = false
doc = false

[[bin]]
name = "round_trip"
path = "fuzz_targets/round_trip.rs"
test = false
doc = false

[[bin]]
name = "mouse_selection"
path = "fuzz_targets/mouse_selection.rs"
test = false
doc = false

[[bin]]
name = "render"
path = "fuzz_targets/render.rs"
test = false
doc = false
