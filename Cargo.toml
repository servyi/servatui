[package]
name = "servyi-servatui"
version = "0.8.3"
edition = "2021"
license = "MIT"
description = "Generic server-client framework with TUI/CLI frontends. Define protocols with type-safe builder chains."

[workspace]
members = ["display"]

[workspace.lints.rust]
# Idiomatic baseline (redundant imports, redundant crates in paths, ...).
rust_2018_idioms = { level = "warn", priority = -1 }
# `unsafe` blocks that contain nothing requiring unsafe (e.g. dereferencing
# a plain `&T` inside `unsafe`). Keeps `unsafe` honest at the other end of
# the spectrum from `unsafe_scope`.
unused_unsafe = "deny"
# Unsafe operations inside `unsafe fn` bodies must still be wrapped in an
# explicit inner `unsafe` block.
unsafe_op_in_unsafe_fn = "deny"
# Unused results and ignored must-use values.
unused_results = "deny"
unused_must_use = "deny"
# Identifiers are ASCII: catches homoglyph look-alikes at zero cost.
non_ascii_idents = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
# The whole default clippy group (correctness, suspicious, style,
# complexity, perf). CI runs plain `cargo clippy -- -D warnings` in every
# project, which is this plus default-level rustc lints.
all = "deny"
# At most one unsafe operation (unsafe call, raw deref, ...) per unsafe
# block: `*buf.add(idx)` must be split via let-chaining.
multiple_unsafe_ops_per_block = "deny"
# Every `unsafe` block carries a `// SAFETY:` comment explaining its
# invariants.
undocumented_unsafe_blocks = "deny"
# Panicking via unwrap or bare `panic!` in library code — fail with
# `.expect("why this must succeed")` or a typed error instead. Projects
# exempt tests via `#![cfg_attr(test, allow(...))]` as needed.
unwrap_used = "deny"
panic = "deny"
# Public functions that can panic must document it ("# Panics" section).
missing_panics_doc = "deny"
# Leftover debugging / placeholder markers must not ship.
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"


[lints]
workspace = true

[features]
default = ["tui"]
tui = ["dep:crossterm", "dep:ratatui", "dep:tui-input", "dep:textwrap", "dep:base64", "dep:signal-hook"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossterm = { version = "0.28", optional = true }
ratatui = { version = "0.28", optional = true, features = ["unstable-widget-ref"] }
tui-input = { version = "0.10", optional = true }
textwrap = { version = "0.16", default-features = false, features = ["unicode-width"], optional = true }
base64 = { version = "0.22", optional = true }
signal-hook = { version = "0.3", optional = true }
libc = "0.2"

[dev-dependencies]
servatui-display = { path = "display" }
tempfile = "3"
servyi-ioprovider = { git = "https://github.com/servyi/ioprovider.git" }
tokio = { version = "1", features = ["macros", "rt"] }
tokio-test = "0.4"

[[example]]
name = "echo"

[[example]]
name = "lorem"

[[example]]
name = "panic-smoke"
required-features = ["tui"]

[[example]]
name = "mouse-recorder"
required-features = ["tui"]

[[example]]
name = "size-check"
required-features = ["tui"]
